name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows-ucrt64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            git
      - name: Get Far Manager SDK headers
        shell: msys2 {0}
        run: git clone --depth 1 https://github.com/FarGroup/FarManager.git ../FarManager
      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFAR_SOURCE_DIR="$PWD/../FarManager"
      - name: Build
        shell: msys2 {0}
        run: cmake --build build
